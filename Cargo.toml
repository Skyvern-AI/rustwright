[package]
name = "rustwright-core"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Rust CDP core for a Python Playwright-compatible automation API"
license = "MIT"
repository = "https://github.com/Skyvern-AI/rustwright"
homepage = "https://github.com/Skyvern-AI/rustwright"
readme = "README.md"
keywords = ["browser", "automation", "cdp", "playwright", "chromium"]
categories = ["web-programming"]

[workspace]
members = ["node", "capi", "rust-native", "agent"]
resolver = "2"

[features]
default = ["python"]
python = ["dep:pyo3"]
# Native connection probes, local CA injection, and internal runtime-state
# probes for explicit test wheels only.
# Default and release wheel builds must not enable this feature.
test-support = [
    "python",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]

[lib]
name = "_rustwright"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
pyo3 = { version = "0.29", features = ["abi3-py38"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.194", features = ["derive"] }
serde_json = "1.0.127"
libc = "0.2.186"
tempfile = "3.8.1"
thiserror = "2"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1.15.0", optional = true }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
webpki-roots = { version = "0.26.11", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
